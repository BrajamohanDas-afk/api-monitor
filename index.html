<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>API Monitor</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --muted:#8a93a5; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --line:#262b36; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace, Consolas, monospace; }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--muted); }
  main { padding:20px; max-width:1100px; margin:0 auto; display:grid; gap:24px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:normal; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
  #err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>API Monitor</h1>
  <button id="refresh">Refresh</button>
  <button id="check">Check now</button>
  <span id="err"></span>
  <span class="muted" id="updated" style="margin-left:auto"></span>
</header>
<main>
  <section>
    <h2>Per endpoint</h2>
    <table id="stats"><thead><tr><th>URL</th><th>Checks</th><th>Uptime</th><th>p50</th><th>p95</th><th>Last status</th><th>Last check</th></tr></thead><tbody></tbody></table>
  </section>
  <section>
    <h2>Recent checks (newest first)</h2>
    <table id="logs"><thead><tr><th>Time</th><th>URL</th><th>Status</th><th>Duration</th><th>Flags</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time = ts => ts ? new Date(ts).toLocaleString() : '-';
const $ = id => document.getElementById(id);

async function load() {
  try {
    const [stats, logs] = await Promise.all([
      fetch('/stats').then(r => r.json()),
      fetch('/logs?limit=50').then(r => r.json())
    ]);
    $('stats').querySelector('tbody').innerHTML = stats.stats.map(s => {
      const up = s.uptime_pct == null ? '-' : s.uptime_pct.toFixed(1) + '%';
      const cls = s.uptime_pct == null ? 'muted' : s.uptime_pct >= 99 ? 'ok' : s.uptime_pct >= 95 ? 'warn' : 'bad';
      const st = s.last_status === null ? '-' : s.last_status;
      return `<tr><td>${esc(s.url)}</td><td>${s.checks}</td><td class="${cls}">${up}</td><td>${s.p50_ms ?? '-'}</td><td>${s.p95_ms ?? '-'}</td><td>${esc(st)}</td><td class="muted">${time(s.last_check)}</td></tr>`;
    }).join('');
    $('logs').querySelector('tbody').innerHTML = logs.logs.map(l => {
      const flags = [l.slow ? '<span class="warn">SLOW</span>' : '', l.error ? `<span class="bad">${esc(l.error)}</span>` : ''].filter(Boolean).join(' ');
      return `<tr><td class="muted">${time(l.timestamp)}</td><td>${esc(l.url)}</td><td class="${l.success ? 'ok' : 'bad'}">${esc(l.status)}</td><td>${l.duration ?? '-'} ms</td><td>${flags || '-'}</td></tr>`;
    }).join('');
    $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    $('err').textContent = '';
  } catch (e) {
    $('err').textContent = 'load failed: ' + e.message;
  }
}

$('refresh').onclick = load;
$('check').onclick = async () => { $('check').disabled = true; try { await fetch('/check', {method:'POST'}); } finally { $('check').disabled = false; load(); } };
load();
setInterval(load, 30000);
</script>
</body>
</html>
